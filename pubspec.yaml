name: hyper_local
description: "Homzy Delivery - deliver orders for Homzy"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  dio: ^5.8.0+1
  fluttertoast: ^9.1.0
  intl_phone_field: ^3.2.0
  hive_flutter: ^1.1.0
  file_picker: ^12.0.0-beta.7
  country_picker: ^2.0.27
  permission_handler: ^12.0.1
  animated_toggle_switch: ^0.8.5
  location: ^8.0.1
  url_launcher: ^6.2.5
  flutter_map: ^8.3.0
  flutter_background_service: ^5.0.5
  latlong2: ^0.9.0
  flutter_polyline_points: ^3.1.0
  share_plus: ^13.1.0
  flutter_styled_toast: ^2.2.1
  geolocator: ^14.0.3
  fl_chart: ^1.2.0
  intl: ^0.20.2
  flutter_screenutil: ^5.9.0
  flutter_html: ^3.0.0
  confetti: ^0.8.0
  flutter_local_notifications: ^22.0.1
  firebase_core: 4.4.0
  firebase_messaging: ^16.1.1
  firebase_auth: ^6.1.4
  connectivity_plus: ^7.1.1
  lottie: ^3.1.0
  flutter_tabler_icons: ^1.43.0
  pin_code_fields: ^9.4.0
