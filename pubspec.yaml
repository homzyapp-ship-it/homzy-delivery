  cached_network_image: ^3.4.1
  get_it: ^9.2.1
  flutter_animate: ^4.5.2
  flutter_native_splash: ^2.4.7
  upgrader: ^13.5.0
  slide_action: ^0.0.2
  popover: ^0.4.0
  flutter_ringtone_player: ^4.0.0+4
  flutter_svg: ^2.2.3
  qr_flutter: ^4.1.0
  image_picker: ^1.2.3
  quick_actions: ^1.1.0
  firebase_crashlytics: ^5.0.7
  firebase_analytics: ^12.1.2



dependency_overrides:
  html: 0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2


flutter:
  generate: true

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/png/
    - assets/lottie/
    - assets/refer_earn/
    - assets/location_disclose/
    - assets/onBoarding/
    - assets/sounds/
    - assets/svg/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/png/app_logo_main.png"
